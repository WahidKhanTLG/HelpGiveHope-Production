<template>
    <!-- Spinner: until recId is resolved, or (after recId) while status is being checked -->
    <template lwc:if={isLoading}>
        <div class="center">
            <lightning-spinner alternative-text="Preparing form" size="medium"></lightning-spinner>
        </div>
    </template>

    <!-- After loading -->
    <template lwc:else>
        <!-- If we still don't have a recordId -->
        <template lwc:if={missingRecId}>
            <p>Loading… (no recordId found in the URL yet)</p>
        </template>

        <!-- We have a recordId; branch on form status -->
        <template lwc:else>
            <!-- Inactive -->
            <template lwc:if={isFormInactive}>
    <div class="slds-grid slds-grid_align-center">
        <div class="slds-col slds-size_12-of-12 slds-medium-size_8-of-12 slds-large-size_6-of-12">
            <div class="form-unavailable-container slds-card slds-theme_shade slds-text-align_center slds-m-around_medium">
                
                <!-- Header -->
                <div class="slds-card__header slds-theme_alert-texture slds-theme_error">
                    <div class="slds-media slds-media_center">
                        <div class="slds-media__figure">
                            <lightning-icon 
                                icon-name="utility:ban" 
                                size="medium" 
                                variant="inverse" 
                                alternative-text="Form Unavailable">
                            </lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <h2 class="slds-card__header-title slds-text-heading_medium slds-text-color_inverse">
                                Form Not Available
                            </h2>
                        </div>
                    </div>
                </div>

                <!-- Body -->
                <div class="slds-card__body slds-p-around_medium">
                    <div class="message-container">
                        <p class="slds-text-body_regular slds-text-color_default slds-text-font_bold slds-m-bottom_medium">
                            {formStatus.message}
                        </p>

                        <div class="slds-box slds-box_small slds-theme_info slds-m-top_medium">
                            <div class="slds-media">
                                <div class="slds-media__figure">
                                    <lightning-icon 
                                        icon-name="utility:info" 
                                        size="small" 
                                        variant="inverse" 
                                        alternative-text="Information">
                                    </lightning-icon>
                                </div>
                                <div class="slds-media__body">
                                    <p class="slds-text-color_default">
                                        If you have any questions, please contact Help Give Hope for assistance.
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            
            </div>
        </div>
    </div>
</template>


            <!-- Active -> show Flow -->
            <template lwc:else>
                <lightning-flow
                    flow-api-name={flowName}
                    flow-input-variables={inputVariables}
                    onstatuschange={handleStatusChange}>
                </lightning-flow>
            </template>
        </template>
    </template>
</template>

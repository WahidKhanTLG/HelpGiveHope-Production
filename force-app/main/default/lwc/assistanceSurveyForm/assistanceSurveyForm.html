<template>
    <!-- 1) Loading while checking form status -->
    <template lwc:if={isCheckingFormStatus}>
        <div class="slds-grid slds-grid_align-center">
            <div class="slds-col slds-size_12-of-12 slds-medium-size_8-of-12 slds-large-size_6-of-12">
                <div class="slds-p-around_medium">
                    <lightning-spinner alternative-text="Checking form status" size="medium"></lightning-spinner>
                </div>
            </div>
        </div>
    </template>

    <!-- 2) After loading -->
    <template lwc:else>
        <!-- 2a) ACTIVE FORM CONTENT -->
        <template lwc:if={isFormActive}>
            <div class="slds-grid slds-grid_align-center">
                <div class="slds-col slds-size_12-of-12 slds-medium-size_10-of-12 slds-large-size_8-of-12">
                    <div class="survey-container">
                        <lightning-card>
                            <div slot="title" class="slds-card__header">
                                <div class="header-content">
                                    <img src={logoUrl} class="logo" alt="Help Give Hope Logo" />
                                    <h1>GENERAL ASSISTANCE FORM</h1>
                                </div>
                            </div>

                            <div class="slds-card__body">
                                <!-- Use lwc:if / lwc:else for submit state -->
                                <template lwc:if={isSubmitted}>
                                    <div class="thank-you-message">
                                        <h2>Thank you for your feedback!</h2>
                                        <p>Your response has been successfully submitted.</p>
                                    </div>
                                </template>
                                <template lwc:else>
                                    <div class="intro-text">
                                        <p>We value your feedback! Please take a moment to share your experience with our assistance program.</p>
                                    </div>

                                    <div class="form-content">
                                        <!-- Recommendation -->
                                        <div class={recommendSectionClasses}>
                                            <label class="form-label">Would you recommend this program to others?</label>
                                            <div class="custom-toggle">
                                                <lightning-input
                                                    type="toggle"
                                                    label="Recommend"
                                                    checked={recommendValue}
                                                    onchange={handleRecommendChange}
                                                    message-toggle-active="Yes"
                                                    message-toggle-inactive="No"
                                                ></lightning-input>
                                            </div>
                                            <div class="error-message" if:true={recommendError}>{recommendError}</div>
                                        </div>

                                        <!-- Resources Feedback -->
                                        <div class={resourcesSectionClasses}>
                                            <label class="form-label">
                                                <abbr class="slds-required slds-p-right_xx-small" title="required">*</abbr>
                                                How satisfied were you with the resources provided?
                                            </label>
                                            <div class="custom-textarea">
                                                <lightning-textarea
                                                    placeholder="Please share your thoughts about the resources..."
                                                    value={resourcesValue}
                                                    onchange={handleResourcesChange}
                                                    variant="label-hidden"
                                                    required
                                                ></lightning-textarea>
                                            </div>
                                            <div class="char-count">{resourcesCharCount}</div>
                                            <div class="error-message" if:true={resourcesError}>{resourcesError}</div>
                                        </div>

                                        <!-- Financial Improvement -->
                                        <div class={financialSectionClasses}>
                                            <label class="form-label">Have you noticed any improvements in your financial well-being?</label>
                                            <div class="custom-toggle">
                                                <lightning-input
                                                    type="toggle"
                                                    label="Financial Improvement"
                                                    checked={financialImprovementValue}
                                                    onchange={handleFinancialImprovementChange}
                                                    message-toggle-active="Yes"
                                                    message-toggle-inactive="No"
                                                ></lightning-input>
                                            </div>
                                            <div class="error-message" if:true={financialError}>{financialError}</div>
                                        </div>

                                        <!-- Suggestions -->
                                        <div class={suggestionsSectionClasses}>
                                            <label class="form-label">
                                                <abbr class="slds-required slds-p-right_xx-small" title="required">*</abbr>
                                                What suggestions do you have for improving Help Give Hope?
                                            </label>
                                            <div class="custom-textarea">
                                                <lightning-textarea
                                                    placeholder="Your suggestions help us improve..."
                                                    value={suggestionsValue}
                                                    onchange={handleSuggestionsChange}
                                                    variant="label-hidden"
                                                    required
                                                ></lightning-textarea>
                                            </div>
                                            <div class="char-count">{suggestionsCharCount}</div>
                                            <div class="error-message" if:true={suggestionsError}>{suggestionsError}</div>
                                        </div>

                                        <!-- Satisfaction Rating -->
                                        <div class={satisfactionSectionClasses}>
                                            <label class="form-label">
                                                <abbr class="slds-required slds-p-right_xx-small" title="required">*</abbr>
                                                How satisfied were you with the overall program experience?
                                            </label>
                                            <div class="rating-container">
                                                <div class="rating-options">
                                                    <template for:each={ratingOptions} for:item="option">
                                                        <div 
                                                            key={option.value}
                                                            class={option.classes}
                                                            data-value={option.value}
                                                            onmouseenter={handleRatingHover}
                                                            onmouseleave={handleRatingLeave}
                                                            onclick={handleRatingSelect}
                                                        >
                                                            <span class="emoji">{option.icon}</span>
                                                            <span class="rating-label">{option.label}</span>
                                                        </div>
                                                    </template>
                                                </div>
                                            </div>
                                            <div class="error-message" if:true={satisfactionError}>{satisfactionError}</div>
                                        </div>

                                        <!-- Submit Section -->
                                        <div class="submit-section">
                                            <lightning-button
                                                label="Submit Survey"
                                                icon-name="utility:check"
                                                class="submit-button"
                                                onclick={handleSubmit}
                                                disabled={isSubmitting}
                                            ></lightning-button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </lightning-card>
                    </div>
                </div>
            </div>
        </template>

        <!-- 2b) INACTIVE FORM MESSAGE -->
        <template lwc:else>
            <div class="slds-grid slds-grid_align-center">
                <div class="slds-col slds-size_12-of-12 slds-medium-size_8-of-12 slds-large-size_6-of-12">
                    <div class="form-unavailable-container slds-card slds-theme_shade slds-text-align_center slds-m-around_medium">
                        <div class="slds-card__header slds-theme_alert-texture slds-theme_error">
                            <div class="slds-media slds-media_center">
                                <div class="slds-media__figure">
                                    <lightning-icon icon-name="utility:ban" size="medium" variant="inverse" alternative-text="Form Unavailable"></lightning-icon>
                                </div>
                                <div class="slds-media__body">
                                    <h2 class="slds-card__header-title slds-text-heading_medium slds-text-color_inverse">Form Not Available</h2>
                                </div>
                            </div>
                        </div>
                        <div class="slds-card__body slds-p-around_medium">
                            <div class="message-container">
                                <p class="slds-text-body_regular slds-text-color_default slds-text-font_bold slds-m-bottom_medium">{formStatus.message}</p>
                                <div class="slds-box slds-box_small slds-theme_info slds-m-top_medium">
                                    <div class="slds-media">
                                        <div class="slds-media__figure">
                                            <lightning-icon icon-name="utility:info" size="small" variant="inverse" alternative-text="Information"></lightning-icon>
                                        </div>
                                        <div class="slds-media__body">
                                            <p class="slds-text-color_default">If you have any questions, please contact Help Give Hope for assistance.</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </template>
</template>
